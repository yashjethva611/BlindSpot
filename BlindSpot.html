<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlindSpot – Project Gap Analyzer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--ac:#4f46e5;--cr:#dc2626;--hi:#ea580c;--me:#ca8a04;--lo:#2563eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b26;--tx:#e8ebf3;--mu:#98a2b3;--bd:#2a3042;--ac:#818cf8;--cr:#f87171;--hi:#fb923c;--me:#facc15;--lo:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b26;--tx:#e8ebf3;--mu:#98a2b3;--bd:#2a3042;--ac:#818cf8;--cr:#f87171;--hi:#fb923c;--me:#facc15;--lo:#60a5fa;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0;font-size:26px}.sub{color:var(--mu);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:200px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button,.fb{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
button.s,.fb{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input[type=file]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.st b{display:block;font-size:24px}.st span{color:var(--mu);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.f{border-left:5px solid var(--lo)}.f.Critical{border-color:var(--cr)}.f.High{border-color:var(--hi)}.f.Medium{border-color:var(--me)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hd h3{margin:0;font-size:16px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid var(--bd);color:var(--mu)}
.lv{color:#fff;border:0}.lv.Critical{background:var(--cr)}.lv.High{background:var(--hi)}.lv.Medium{background:var(--me);color:#111}.lv.Low{background:var(--lo)}
.f p{margin:8px 0 0}.k{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);font-weight:700;margin-top:10px}
.ev{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:6px 10px;margin-top:4px;font-size:13px;color:var(--mu)}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:30px}
</style></head><body><div class="w">
<h1>🔍 BlindSpot</h1>
<p class="sub">Paste or upload a project document, workflow, CSV or JSON dataset. BlindSpot finds missing assumptions, overlooked constraints and unasked questions, ranked by impact, with the evidence behind each finding.</p>
<div class="card">
<textarea id="in" placeholder="Paste your project document, plan, workflow description, CSV or JSON here…"></textarea>
<div class="row">
<button id="go">Analyze</button>
<label class="fb">Upload file<input type="file" id="fi" accept=".txt,.md,.csv,.json,.tsv"></label>
<button class="s" id="cl">Clear</button>
<span id="meta" class="sub" style="margin:0"></span>
</div></div>
<div id="out"></div>
</div>
<script>
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// [category,title,triggerRegex|null,coveredRegex,impact,question,recommendation,why]
const R=[
['Financial','No contingency reserve for cost overruns',/budget|cost|fund|pric|₹|\$|€|\brs\.?\s?\d|lakh|crore/i,/contingenc|reserve|buffer|overrun|variance/i,8,'What happens if the cost rises 20–30%? Who approves extra spend?','Add a 10–20% contingency line and a documented approval path for overruns.','Projects with fixed budgets and no reserve are the most common to stall mid-way.'],
['Financial','Recurring and hidden costs not planned',/cloud|host|aws|azure|server|licen|subscription|api|infrastructure|third.?party/i,/recurring|monthly|annual|operat(ing|ional) cost|running cost|total cost of ownership|tco|maintenance cost/i,7,'What does it cost per month after launch, and who pays?','Build a 12–24 month run-cost forecast (hosting, licences, API calls, support).','Launch budgets often ignore costs that begin after go-live.'],
['Schedule','Timeline has no buffer or critical path',/deadline|launch|milestone|go.?live|sprint|week|month|by \d|due|delivery/i,/buffer|slack|critical path|float|contingency time|dependency map|gantt/i,8,'Which tasks are on the critical path, and what slips if one is late?','Identify the critical path, add 15–25% schedule buffer, mark hard external dates.','Deadlines without slack convert any small delay into a missed launch.'],
['Schedule','Task dependencies not mapped',/depend|after|before|once|then|phase|integrat|wait/i,/dependency (map|matrix|log)|predecessor|blocked by|prerequisite/i,6,'Which tasks block others, and who owns each hand-off?','Create a dependency log with owner and need-by date for each hand-off.','Implicit dependencies are discovered late, usually when they are already blocking.'],
['Data','Data quality and validation not addressed',/data|dataset|database|record|import|migrat|analytics|report/i,/quality|clean|validat|missing|duplicate|accuracy|integrity|schema/i,8,'How will bad, missing or duplicate data be detected and corrected?','Define validation rules, quality thresholds and an owner for data cleaning.','Models, reports and migrations inherit every flaw in their source data.'],
['Data','Data ownership, retention and backup undefined',/data|database|record|storage|log|archive/i,/retention|backup|archiv|data owner|steward|disaster recovery|\brpo\b|\brto\b/i,6,'Who owns the data, how long is it kept and how is it restored?','Document owner, retention period, backup frequency and recovery targets.','Without recovery targets, a failure becomes an unplanned outage of unknown length.'],
['Compliance','Privacy and regulatory obligations missing',/user|customer|student|patient|employee|personal|email|phone|payment|aadhaar|pii|kyc|account/i,/gdpr|dpdp|privacy|consent|hipaa|pci|compliance|regulat|anonymi[sz]|data protection/i,9,'Which laws apply to the personal data collected, and where is consent recorded?','Run a data-protection assessment; list data fields, lawful basis, consent and deletion flows.','Regulatory breaches carry fines and can force a product shutdown.'],
['Compliance','Licensing and intellectual property unclear',/open.?source|third.?party|vendor|library|content|image|template|plugin|outsourc/i,/licen[cs]e|copyright|\bip\b|intellectual property|ownership of|nda|terms of use/i,6,'Who owns the deliverables, and are all reused components licensed for this use?','Audit dependencies for licences; specify IP ownership in vendor contracts.','Licence conflicts surface at audit or acquisition time, when they are costly to fix.'],
['Technical','Security threat model absent',/login|auth|password|api|cloud|server|payment|web|app|portal|database|online/i,/security|threat|penetration|pen.?test|encrypt|access control|owasp|vulnerab|mfa|two.?factor/i,9,'What are the top attack paths, and who tests for them before release?','Perform a threat model, enforce least-privilege access and schedule a security test before launch.','Security gaps are cheapest to fix at design time and most expensive after a breach.'],
['Technical','Scalability and load not considered',/user|traffic|launch|platform|app|portal|website|concurrent|growth|campus|customers/i,/scal|load test|concurren|capacity|peak|throughput|performance|latency|stress/i,7,'How many simultaneous users must it support, and what is the peak?','State peak-load targets and run a load test before launch.','Systems sized for average use fail at the first peak event.'],
['Technical','Testing and acceptance criteria missing',/build|develop|implement|release|deploy|feature|module|code|software|system/i,/\btest|\bqa\b|uat|acceptance criteria|definition of done|regression|quality assurance/i,8,'How will we know each deliverable is finished and correct?','Write acceptance criteria per feature and plan unit, integration and user acceptance testing.','Untested scope turns into rework after delivery.'],
['Technical','No rollback or cut-over plan',/deploy|launch|migrat|release|go.?live|cut.?over|upgrade/i,/rollback|roll back|cut.?over|staging|fallback|revert|blue.?green|canary/i,7,'If launch fails, how do we return to the previous working state?','Define a staging environment, rollback steps and go/no-go criteria.','A failed launch without rollback means extended downtime.'],
['Operations','Post-launch support and maintenance unplanned',/launch|deliver|go.?live|handover|release|rollout/i,/maintenance|support|operations|monitor|post.?launch|sla|on.?call|helpdesk|incident/i,7,'Who fixes issues after launch, in what time, and who monitors health?','Define support tiers, response targets, monitoring and a maintenance budget.','Most system lifetime cost and user frustration occur after launch.'],
['Operations','Training and change management missing',/adopt|rollout|process|workflow|user|staff|employee|transition|new system|replace/i,/training|onboard|change management|documentation|user guide|communication plan|handover/i,6,'How will users learn the new process, and who resists it?','Plan training, documentation and a communication schedule before rollout.','Adoption, not delivery, determines whether the project succeeds.'],
['People','Stakeholder ownership and decision rights unclear',/team|stakeholder|client|approval|sponsor|manager|department|committee|review/i,/owner|raci|responsible|accountable|sign.?off|decision.?maker|escalation|governance/i,7,'Who has final say, and how are disagreements escalated?','Create a RACI chart and name one accountable owner per deliverable.','Unclear decision rights are a leading cause of scope and schedule conflict.'],
['People','Key-person and resource availability risk',/developer|engineer|designer|analyst|lead|resource|team member|contractor|intern|volunteer|\b\d+ (people|members)/i,/backup|cross.?train|capacity|availability|leave|bus factor|succession|allocation/i,7,'What if a key person leaves or is only part-time available?','Document knowledge, cross-train and confirm allocation percentages.','Single points of failure in staffing are often invisible until someone is absent.'],
['Planning','Success metrics not defined',/goal|objective|aim|improve|increase|reduce|deliver|outcome|vision/i,/kpi|metric|success criteria|measure|target of|baseline|okr|benchmark/i,8,'What measurable result proves this project worked, and what is the baseline?','Define 3–5 KPIs with baseline, target and measurement method.','Without baselines, success cannot be demonstrated and scope drifts.'],
['Planning','Scope boundaries and exclusions not stated',null,/out of scope|non.?goal|exclusion|not included|scope|change request|change control/i,7,'What is explicitly not included, and how are new requests handled?','List exclusions and add a change-control process.','Unstated scope is the main source of creep.'],
['Planning','No risk register or mitigation plan',null,/risk|mitigation|contingency plan|assumption log|issue log/i,8,'What are the top 10 risks, their likelihood, impact and owners?','Create a risk register reviewed weekly with owners and mitigations.','Unnamed risks cannot be monitored or mitigated.'],
['External','Third-party dependency has no SLA or fallback',/vendor|third.?party|supplier|external|integration|gateway|partner|api provider|outsourc/i,/sla|fallback|alternative|exit plan|contract|escrow|service level/i,8,'What if the vendor changes terms, has an outage or exits?','Obtain SLAs, identify a backup provider and isolate integrations behind an interface.','External failures are outside your control; only the response is yours.'],
['Inclusion','Accessibility and localization not considered',/user|customer|public|citizen|student|app|website|portal|consumer|audience/i,/accessib|wcag|screen reader|locali[sz]|multilingual|language|translation|disab/i,5,'Who might be unable to use this, or need another language or device?','Set an accessibility standard (e.g. WCAG 2.1 AA) and identify required languages.','Excluding users reduces reach and may breach regulation.']
];
const ASM=/\b(assum\w*|should be|will be|probably|obviously|easy|simple|just|tbd|tba|asap|etc\.?|hopefully|expect(ed)? to|likely|always|never|everyone|no problem|straightforward|trivial)\b/i;
const lvl=s=>s>=7.5?'Critical':s>=6?'High':s>=4?'Medium':'Low';
const sents=t=>t.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>12);
function splitCSV(l,d){return l.split(new RegExp(d+'(?=(?:[^"]*"[^"]*")*[^"]*$)')).map(x=>x.trim().replace(/^"|"$/g,''))}
function tabular(t){
 const x=t.trim();
 if(/^[\[{]/.test(x)){try{let j=JSON.parse(x);if(!Array.isArray(j))j=[j];if(j.length&&typeof j[0]==='object'){const h=[...new Set(j.flatMap(o=>Object.keys(o)))];return{h,r:j.map(o=>h.map(k=>o[k]==null?'':String(o[k])))}}}catch(e){}}
 const L=x.split(/\r?\n/).filter(l=>l.trim());if(L.length<4)return null;
 const d=L[0].split('\t').length>2?'\t':',';const n=splitCSV(L[0],d).length;if(n<3)return null;
 const rows=L.slice(1).map(l=>splitCSV(l,d));const ok=rows.filter(r=>r.length===n).length;
 if(ok/rows.length<.8)return null;return{h:splitCSV(L[0],d),r:rows.filter(r=>r.length===n)}}
function dataFindings(T){
 const F=[],{h,r}=T,N=r.length;
 h.forEach((c,i)=>{
  const col=r.map(x=>x[i]);const miss=col.filter(v=>v===''||/^(na|n\/a|null|none|nan|-)$/i.test(v)).length;
  if(miss/N>.03)F.push({cat:'Data',title:`Column “${c}” has ${(miss/N*100).toFixed(1)}% missing values`,score:Math.min(9,5+miss/N*10),q:`Why is “${c}” blank in ${miss} rows, and is it missing at random?`,r:'Decide to impute, exclude or collect again; document the rule used.',w:'Missing data biases averages, models and joins.',ev:[`${miss} of ${N} rows empty in “${c}”.`]});
  const vals=col.filter(v=>v!=='');const num=vals.filter(v=>v!==''&&!isNaN(+v));
  if(vals.length&&num.length/vals.length>.7&&num.length<vals.length)F.push({cat:'Data',title:`Column “${c}” mixes numbers and text`,score:6.5,q:`Which entries in “${c}” are invalid, and why were they accepted?`,r:'Add input validation and normalise entries to one type.',w:'Mixed types break calculations silently.',ev:vals.filter(v=>isNaN(+v)).slice(0,3).map(v=>`Non-numeric value: “${v}”`)});
  if(num.length>8&&num.length===vals.length){const a=num.map(Number).sort((p,q)=>p-q),q1=a[Math.floor(a.length*.25)],q3=a[Math.floor(a.length*.75)],iq=q3-q1,o=a.filter(v=>v<q1-3*iq||v>q3+3*iq);
   if(iq>0&&o.length)F.push({cat:'Data',title:`Extreme outliers in “${c}”`,score:6.5,q:`Are values like ${o[0]} real, or entry/unit errors?`,r:'Check against source; set plausible range limits.',w:'Outliers distort statistics and thresholds.',ev:[`${o.length} value(s) beyond 3×IQR (e.g. ${o.slice(0,3).join(', ')}); typical range ${q1}–${q3}.`]})}
  if(N>10&&new Set(vals).size===1)F.push({cat:'Data',title:`Column “${c}” holds a single constant value`,score:3.5,q:`Is “${c}” needed, or is variation missing from the sample?`,r:'Remove or confirm the field; check sampling coverage.',w:'Constant fields hint at sampling or extraction problems.',ev:[`All ${vals.length} filled rows equal “${vals[0]}”.`]})});
 const seen=new Map();r.forEach(x=>{const k=x.join('|');seen.set(k,(seen.get(k)||0)+1)});
 const dup=[...seen.values()].filter(v=>v>1).reduce((a,v)=>a+v-1,0);
 if(dup)F.push({cat:'Data',title:`${dup} fully duplicated row(s)`,score:7,q:'Are duplicates true repeats or ingestion errors?',r:'Deduplicate on a stable key and add a uniqueness constraint.',w:'Duplicates inflate counts and distort metrics.',ev:[`${dup} duplicate row(s) among ${N}.`]});
 const sens=h.filter(c=>/email|phone|mobile|aadhaar|pan|dob|birth|address|name|ssn|passport|salary|gender/i.test(c));
 if(sens.length)F.push({cat:'Compliance',title:'Dataset contains personal or sensitive fields',score:8.5,q:'Is there consent, a lawful basis and access control for these fields?',r:'Minimise, mask or pseudonymise; restrict access and define retention.',w:'Personal data triggers privacy obligations and breach exposure.',ev:[`Sensitive columns: ${sens.join(', ')}.`]});
 if(N<30)F.push({cat:'Data',title:'Small sample size',score:5.5,q:'Is this sample representative enough for the decisions planned?',r:'Increase data or state the statistical limits of conclusions.',w:'Small samples give unstable conclusions.',ev:[`Only ${N} rows analysed.`]});
 return F}
function analyze(t){
 const S=sents(t),F=[],tab=tabular(t);
 if(tab)F.push(...dataFindings(tab));
 if(!tab||t.length>0&&S.length>6){
  R.forEach(([cat,title,tr,cv,imp,q,rec,why])=>{
   if(cv.test(t))return;
   let hits=[];if(tr){hits=S.filter(s=>tr.test(s));if(!hits.length)return}
   const conf=tr?.6+.4*Math.min(hits.length,3)/3:.7;
   F.push({cat,title,score:imp*conf,q,r:rec,w:why,ev:hits.slice(0,3),tr})});
  const am=S.filter(s=>ASM.test(s));
  if(am.length)F.push({cat:'Assumptions',title:`${am.length} unvalidated or vague statement(s)`,score:Math.min(8,4.5+am.length*.5),q:'Which of these statements are verified facts, and which are guesses?',r:'Move each into an assumption log with an owner, a validation method and a date.',w:'Words like “should”, “just”, “TBD” and “easy” mark untested beliefs.',ev:am.slice(0,4),tr:new RegExp(ASM.source,'gi')});
  const num=S.filter(s=>/\b(will|must|need)\b/i.test(s)&&!/\d/.test(s)&&/deliver|support|handle|improve|reduce|increase|fast|quick/i.test(s));
  if(num.length>1)F.push({cat:'Planning',title:'Requirements stated without measurable values',score:6,q:'What number defines “fast”, “improve” or “support” here?',r:'Rewrite requirements with measurable thresholds.',w:'Non-measurable requirements cannot be tested.',ev:num.slice(0,3)})}
 F.forEach(f=>f.level=lvl(f.score));
 return F.sort((a,b)=>b.score-a.score)}
let ALL=[],cat='All',lv='All';
const $=id=>document.getElementById(id);
function hl(s,tr){let e=esc(s);if(tr){try{e=e.replace(new RegExp(tr.source,'gi'),m=>`<mark>${m}</mark>`)}catch(x){}}return e}
function render(){
 const o=$('out');
 if(!ALL.length){o.innerHTML='';return}
 const cats=['All',...new Set(ALL.map(f=>f.cat))],lvs=['All','Critical','High','Medium','Low'];
 const cnt=l=>ALL.filter(f=>f.level===l).length;
 const pen=ALL.reduce((a,f)=>a+f.score,0),comp=Math.max(0,Math.round(100-pen*1.6));
 const L=ALL.filter(f=>(cat==='All'||f.cat===cat)&&(lv==='All'||f.level===lv));
 o.innerHTML=`<div class="card"><div class="stats">
 <div class="st"><b>${ALL.length}</b><span>Gaps found</span></div>
 <div class="st"><b style="color:var(--cr)">${cnt('Critical')}</b><span>Critical</span></div>
 <div class="st"><b style="color:var(--hi)">${cnt('High')}</b><span>High</span></div>
 <div class="st"><b style="color:var(--me)">${cnt('Medium')}</b><span>Medium</span></div>
 <div class="st"><b>${comp}%</b><span>Readiness score</span></div></div>
 <div class="bar"><i style="width:${comp}%"></i></div></div>
 <div class="chips">${lvs.map(x=>`<button class="chip ${x===lv?'on':''}" data-l="${x}">${x}</button>`).join('')}</div>
 <div class="chips">${cats.map(x=>`<button class="chip ${x===cat?'on':''}" data-c="${x}">${x}</button>`).join('')}
 <button class="chip" id="cp">⧉ Copy report</button></div>
 ${L.length?L.map((f,i)=>`<div class="card f ${f.level}"><div class="hd"><h3>${i+1}. ${esc(f.title)}</h3><span><span class="tag">${esc(f.cat)}</span> <span class="tag lv ${f.level}">${f.level} · ${f.score.toFixed(1)}/10</span></span></div>
 <div class="k">Question you may have missed</div><p>${esc(f.q)}</p>
 <div class="k">Evidence</div>${f.ev.length?f.ev.map(e=>`<div class="ev">${hl(e,f.tr)}</div>`).join(''):'<div class="ev">No mention found anywhere in the input.</div>'}
 <div class="k">Recommendation</div><p>${esc(f.r)}</p>
 <div class="k">Why it matters</div><p>${esc(f.w)}</p></div>`).join(''):'<div class="empty">No findings match this filter.</div>'}`;
 o.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=b.dataset.l;render()});
 o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
 $('cp').onclick=()=>{const t=ALL.map((f,i)=>`${i+1}. [${f.level} ${f.score.toFixed(1)}] ${f.title} (${f.cat})\n   Q: ${f.q}\n   Evidence: ${f.ev.join(' | ')||'none found'}\n   Fix: ${f.r}`).join('\n\n');
  try{navigator.clipboard.writeText(t);$('cp').textContent='✓ Copied'}catch(e){}}}
$('go').onclick=()=>{const t=$('in').value.trim();
 if(t.length<40){$('out').innerHTML='<div class="empty">Add at least a short document, dataset or workflow description to analyze.</div>';ALL=[];return}
 cat='All';lv='All';ALL=analyze(t);$('meta').textContent=`${t.split(/\s+/).length} words analysed`;
 if(!ALL.length)$('out').innerHTML='<div class="empty">No gaps detected by the rule set. Review manually for domain-specific risks.</div>';else render()};
$('cl').onclick=()=>{$('in').value='';$('out').innerHTML='';$('meta').textContent='';ALL=[]};
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('in').value=r.result;$('go').click()};r.readAsText(f)};
</script></body></html>
